<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码登录确认</title>

  <style>
    #info {
      height: 400px;
      line-height: 400px;
      font-size: 20px;
      padding: 20px;
    }

    #confirm,
    #cancel {
      display: block;
      width: 80%;
      line-height: 40px;
      font-size: 20px;
      margin-bottom: 20px;
    }

    #confirm {
      background: skyblue;
    }
  </style>
</head>

<body>
  <button id="foo">登录 foo 账号</button>
  <button id="bar">登录 bar 账号</button>


  <div id="info">
    是否确认登录 xxx 网站？
  </div>
  <button id="confirm">确认登录</button>
  <button id="cancel">取消</button>

  <script>
    const params = new URLSearchParams(window.location.search.slice(1));

    const id = params.get('id');

    let token = ""
    document.getElementById('foo').addEventListener('click', () => {
      fetch(`http://192.168.1.2:3000/login?username=foo&password=111`).then(res => {
        // token = res.data.token;
        return res.json()
      }).then(data => {
        token = data.token;
      });
    });

    document.getElementById('bar').addEventListener('click', () => {
      fetch('http://192.168.1.2:3000/login?username=foo&password=111').then(res => {
        // token = res.data.token;
        return res.json()
      }).then(data => {
        token = data.token;
      });
    });


    fetch('http://192.168.1.2:3000/qrcode/scan?id=' + id).catch(e => {
      alert('scan error');
    });

    document.getElementById('confirm').addEventListener('click', () => {
      fetch('http://192.168.1.2:3000/qrcode/confirm?id=' + id, {
        headers: {
          authorization: 'Bearer ' + token
        }
      }).catch(e => {
        alert('二维码已过期');
      });
    });

    document.getElementById('cancel').addEventListener('click', () => {
      fetch('http://192.168.1.2:3000/qrcode/cancel?id=' + id).catch(e => {
        alert('二维码已过期');
      });
    });
  </script>
</body>

</html>
